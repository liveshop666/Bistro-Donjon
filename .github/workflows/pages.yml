name: Jeu en ligne (GitHub Pages)

# Construit le jeu et le publie sur https://liveshop666.github.io/Bistro-Donjon/ à chaque envoi sur main.
# Réglage à faire une seule fois dans GitHub : Settings > Pages > Source = « GitHub Actions ».
# Attention : cette adresse est ouverte à tout le monde (pas de porte d'entrée comme sur Vercel).
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
