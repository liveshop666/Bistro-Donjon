name: Android

# Construit l'application Android à chaque envoi de code, ou à la demande (onglet Actions > Android > Run workflow).
# - APK de test (debug) : toujours produit, à installer directement sur un téléphone.
# - AAB signé pour le Play Store : produit seulement si les secrets de signature sont renseignés
#   (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD).
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: APK de test
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bistro-donjon-apk-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: AAB signé (Play Store)
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: bistro-donjon-aab-play-store
          path: android/app/build/outputs/bundle/release/app-release.aab
