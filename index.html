<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Bistro Donjon : chasse les monstres-aliments, cuisine et sers tes clients." />
    <link rel="icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Bistro Donjon</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
      body { display: flex; align-items: center; justify-content: center; }
      #game { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      /* le canvas remplit toujours son cadre, même si le recalcul de taille de Phaser arrive en retard */
      /* écran de chargement : le logo au centre sur fond noir, retiré dès que le jeu a fini de charger */
      #splash { position: fixed; inset: 0; background: #04020f; display: flex; align-items: center; justify-content: center; z-index: 10; transition: opacity 0.3s; }
      #splash img { width: min(56vw, 56vh, 320px); height: auto; image-rendering: pixelated; }
      canvas { image-rendering: pixelated; display: block; width: 100% !important; height: 100% !important; margin: 0 !important; }
    </style>
  </head>
  <body>
    <div id="splash"><img src="logo.png" alt="Bistro Donjon" /></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
