<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Bistro Donjon : chasse les monstres-aliments, cuisine et sers tes clients." />
    <link rel="icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Bistro Donjon</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
      body { display: flex; align-items: center; justify-content: center; }
      #game { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      /* le canvas remplit toujours son cadre, même si le recalcul de taille de Phaser arrive en retard */
      /* écran de chargement : le logo au centre sur fond noir, retiré dès que le jeu a fini de charger */
      #splash { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 10; transition: opacity 0.3s; }
      #splash { flex-direction: column; gap: 22px; font-family: 'Lilita One', 'Arial Black', sans-serif; }
      #splash h1 { margin: 0; font-size: min(13vw, 72px); font-weight: 400; letter-spacing: 2px; color: #ffc533;
        text-shadow: 0 4px 0 #a8501a, 0 8px 18px rgba(0,0,0,.7); text-align: center; line-height: 1; }
      #splash .bar { width: min(70vw, 420px); height: 18px; border-radius: 9px; background: #1b1424; border: 3px solid #3a2a1e;
        box-shadow: inset 0 2px 4px rgba(0,0,0,.6); overflow: hidden; }
      #splash .fill { height: 100%; width: 4%; border-radius: 6px; background: linear-gradient(#ffd23e, #e8642a);
        box-shadow: 0 0 12px #ff8a1e; transition: width .15s; }
      #splash p { margin: 0; color: #e8d8c0; font-size: 18px; letter-spacing: 1px; }
      canvas { image-rendering: pixelated; display: block; width: 100% !important; height: 100% !important; margin: 0 !important; }
    </style>
  </head>
  <body>
    <div id="splash"><h1>BISTRO<br />DONJON</h1><div class="bar"><div class="fill" id="splash-fill"></div></div><p id="splash-txt">Chargement... 0 %</p></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
